<!doctype html>
<html lang="en">
	<head>
		<meta charset="UTF-8" />
		<meta name="viewport" content="width=device-width, initial-scale=1.0" />
		<title>Document</title>
	</head>
	<body>
		<header>
			<h1 class="title">Battleship</h1>
		</header>
		<main>
			<div class="new-game" id="div-new-game">
				<h2>Enter your name</h2>
				<input
					type="text"
					name="player-name"
					id="input-player-name"
					placeholder="Admiral"
				/>
				<button type="button" class="btn" id="btn-new-game">New game</button>
			</div>

			<div class="status-bar hidden" id="status-bar">
				<p>Waiting for your orders, <span class="player-name">Admiral</span>!</p>
			</div>

			<div class="game-area hidden" id="game-area">
				<div class="container-field player">
					<p class="waters">Your waters</p>
				</div>
				<div class="place-ships" id="place-ships">
					<p>
						Place your ships on the field. You can change axis by hitting the button
						or pressing "R"
					</p>
					<button type="button" class="rotate" id="btn-rotate">
						Axis: <span id="axis">x</span>
					</button>

					<button class="btn-start disabled" id="btn-start">Start battle</button>
				</div>
				<div class="container-field computer hidden">
					<p class="waters">Enemy's waters</p>
				</div>
			</div>

			<button class="btn-restart hidden" id="btn-restart">Restart</button>
		</main>

		<footer>
			© 2026 <a href="https://www.theodinproject.com/" target="_blank" rel="noopener noreferrer">The Odin Project</a> | <a href="https://github.com/SleepyCasper" target="_blank" rel="noopener noreferrer">SleepyCasper</a>
		</footer>
	</body>
</html>
